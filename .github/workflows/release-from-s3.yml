name: Release from S3

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  S3_BASE_URL: https://aikido-endpoint-binaries.s3.eu-west-1.amazonaws.com

jobs:
  release:
    runs-on: open-source-releaser
    steps:
      - name: Download installers from S3
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Downloading installers for ${TAG} from ${S3_BASE_URL}"
          curl --fail --location --show-error --silent \
            "${S3_BASE_URL}/${TAG}/EndpointProtection.msi" \
            --output EndpointProtection.msi
          curl --fail --location --show-error --silent \
            "${S3_BASE_URL}/${TAG}/EndpointProtection.pkg" \
            --output EndpointProtection.pkg
          curl --fail --location --show-error --silent \
            "${S3_BASE_URL}/${TAG}/EndpointProtection-amd64.deb" \
            --output EndpointProtection-amd64.deb
          curl --fail --location --show-error --silent \
            "${S3_BASE_URL}/${TAG}/EndpointProtection-amd64.el9.rpm" \
            --output EndpointProtection-amd64.el9.rpm
          curl --fail --location --show-error --silent \
            "${S3_BASE_URL}/${TAG}/EndpointProtection-arm64.deb" \
            --output EndpointProtection-arm64.deb
          curl --fail --location --show-error --silent \
            "${S3_BASE_URL}/${TAG}/EndpointProtection-arm64.el10.rpm" \
            --output EndpointProtection-arm64.el10.rpm
          cp EndpointProtection.pkg EndpointProtection-mdm.pkg
          cp EndpointProtection.pkg "EndpointProtection-${VERSION}.pkg"
          cp EndpointProtection.msi "EndpointProtection-${VERSION}.msi"
          ls -la EndpointProtection.msi EndpointProtection.pkg \
            EndpointProtection-mdm.pkg \
            "EndpointProtection-${VERSION}.pkg" \
            "EndpointProtection-${VERSION}.msi" \
            EndpointProtection-amd64.deb \
            EndpointProtection-amd64.el9.rpm \
            EndpointProtection-arm64.deb \
            EndpointProtection-arm64.el10.rpm

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          draft: true
          files: |
            EndpointProtection.msi
            EndpointProtection.pkg
            EndpointProtection-*.pkg
            EndpointProtection-*.msi
            EndpointProtection-amd64.deb
            EndpointProtection-amd64.el9.rpm
            EndpointProtection-arm64.deb
            EndpointProtection-arm64.el10.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
